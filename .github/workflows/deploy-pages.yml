name: Refresh public content and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh public HTML snapshots
        run: node _tools/refresh-public-content.mjs
      - name: Verify snapshot generation
        run: node --test _tools/snapshot.test.mjs
      - name: Check static links and assets
        run: node _tools/check-links.mjs
      - name: Package public files
        run: node _tools/package-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed static pages
        id: deployment
        uses: actions/deploy-pages@v4
